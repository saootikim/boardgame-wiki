# 노트를 올리면(push) Quartz로 웹사이트를 만들어 GitHub Pages에 배포한다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: vault

      - uses: actions/checkout@v5
        with:
          repository: jackyzha0/quartz
          ref: v4.5.2
          path: quartz

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Quartz
        working-directory: quartz
        run: npm ci

      - name: Copy notes into Quartz
        run: |
          rm -rf quartz/content
          rsync -a --exclude .git --exclude .github --exclude .obsidian --exclude .gitignore vault/ quartz/content/
          cp quartz/content/INDEX.md quartz/content/index.md
          cp vault/.github/quartz/quartz.config.ts vault/.github/quartz/quartz.layout.ts quartz/
          cp vault/.github/quartz/EditLink.tsx quartz/quartz/components/

      - name: Build site
        working-directory: quartz
        run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
